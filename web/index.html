<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>IDK | Chat</title>
  <style>
    :root { color-scheme: dark; background: #0f0f0f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0f0f0f; }
    body { display: grid; place-items: center; color: #fff; }
    .mark { width: 64px; height: 64px; border-radius: 18px; animation: breathe 1.2s ease-in-out infinite alternate; }
    @keyframes breathe { to { opacity: .5; transform: scale(.96); } }
  </style>
</head>
<body>
  <img class="mark" src="./icon.png" alt="IDK Chat">
  <script>
    const destination = new URL('https://app.idkchat.ir/App/Auth/index.php');
    destination.searchParams.set('desktop', '1');
    window.location.replace(destination.toString());
  </script>
</body>
</html>
